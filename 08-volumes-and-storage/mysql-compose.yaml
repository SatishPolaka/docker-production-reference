services:
  database:
    image: mysql:8.4                          # Use a supported MySQL release line
    restart: unless-stopped                   # Restart after an unexpected container exit
    environment:
      MYSQL_DATABASE: appdb                    # Initial database name for local practice
      MYSQL_USER: appuser                      # Non-root application account
      MYSQL_PASSWORD_FILE: /run/secrets/db_password # Read password from mounted secret file
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_password # Keep root password out of YAML
    ports:
      - "127.0.0.1:3307:3306"                  # Bind to localhost for local-only access
    volumes:
      - mysql_data:/var/lib/mysql             # Persist database files across container replacement
    secrets:
      - db_password
      - root_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"] # Check whether MySQL responds
      interval: 10s                           # Run health check every 10 seconds
      timeout: 5s                             # Allow 5 seconds for each check
      retries: 10                             # Mark unhealthy after repeated failures

volumes:
  mysql_data:                                 # Docker-managed database volume

secrets:
  db_password:
    file: ./secrets/db_password.txt           # Create locally; do not commit this file
  root_password:
    file: ./secrets/root_password.txt         # Create locally; do not commit this file
